services:
  db:
    image: postgres:16
    container_name: treinamento-crud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treinamento-crud-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules

volumes:
  pgdata:
  node_modules: